steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ux-anomalies-api:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ux-anomalies-api:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ux-anomalies-api'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ux-anomalies-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'uxa-api-sa@ux-anomalies.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'APP_ENV=production,APP_ADDR=:8080,LOG_LEVEL=info,JWT_ISSUER=uxanomalies-api,JWT_AUDIENCE=uxanomalies-bff,JWT_ACCESS_TTL=24h,MAX_BODY_BYTES=1048576,MAX_MULTIPART_BYTES=20971520,MAX_IMAGE_BYTES=5242880,RATE_LIMIT_BACKEND=memory,STORAGE_BACKEND=gcs,GCP_PROJECT_ID=ux-anomalies,GCS_BUCKET=uxanomalies-images-a1b2c3,GCS_UPLOAD_PREFIX=anomalies,GCS_SIGNED_URL_TTL=24h,CORS_ALLOWED_ORIGINS=https://uxanomalies.com'
      - '--update-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,MIGRATIONS_DATABASE_URL=MIGRATIONS_DATABASE_URL:latest,BFF_SECRET=BFF_SECRET:latest,JWT_SIGNING_KEY=JWT_SIGNING_KEY:latest'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ux-anomalies-api:$COMMIT_SHA'
